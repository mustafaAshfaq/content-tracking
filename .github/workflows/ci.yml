name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test, schema drift, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Validate content/product fixtures
        run: npm run fixtures:validate

      - name: Event catalogue JSON Schema drift check
        run: npm run schema:check

      - name: Production build
        run: npm run build
